# Production properties for Smartmaint

# =========================================================
# DATABASE
# =========================================================

spring.datasource.url=jdbc:${DATABASE_URL}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10


# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=smartmaint


# =========================================================
# FLYWAY
# =========================================================

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=39
spring.flyway.out-of-order=true
spring.flyway.validate-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.default-schema=smartmaint
spring.flyway.schemas=smartmaint


# =========================================================
# JWT
# =========================================================

jwt.secret=${JWT_SECRET}


# =========================================================
# SMTP / BREVO
# =========================================================

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_HOST:smtp-relay.brevo.com}

spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000


# =========================================================
# SMARTMAINT MAIL CONFIG
# =========================================================

app.demo.mail.from=${APP_DEMO_MAIL_FROM:smartmaint.co@outlook.com}

app.purchase.mail.from=${APP_PURCHASE_MAIL_FROM:smartmaint.co@outlook.com}

app.demo.login.url=${APP_DEMO_LOGIN_URL:https://smartmaint-frontend-last.vercel.app/login}

app.purchase.login.url=${APP_PURCHASE_LOGIN_URL:https://smartmaint-frontend-last.vercel.app/login}

app.demo.mail.logo.url=${APP_DEMO_MAIL_LOGO_URL:}

app.demo.request.cooldown.hours=${APP_DEMO_REQUEST_COOLDOWN_HOURS:0}


# =========================================================
# SERVER
# =========================================================

server.port=${PORT:8080}


# =========================================================
# LOGGING
# =========================================================

logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.com.smartmaint=INFO