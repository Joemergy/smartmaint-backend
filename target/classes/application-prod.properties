# Production properties for Smartmaint

# Database (PostgreSQL) - values read from environment variables
spring.datasource.url=jdbc:${DATABASE_URL}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10

# JPA / Hibernate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=smartmaint

# Flyway migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=39
spring.flyway.out-of-order=true
spring.flyway.validate-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.default-schema=smartmaint
spring.flyway.schemas=smartmaint

# JWT (application expects a secret via env)
jwt.secret=${JWT_SECRET}

# Mail (SMTP)
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Server port (use $PORT if provided by the hosting platform)
server.port=${PORT:8080}

# Logging defaults
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.com.smartmaint=INFO