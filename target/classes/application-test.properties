# Usar base de datos en memoria H2
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Keep tests isolated from production PostgreSQL migrations
spring.flyway.enabled=false

# Mail disabled in tests by default
app.demo.mail.from=smartmaint.co@outlook.com
app.demo.login.url=http://localhost:3000/login
app.demo.mail.logo.url=
app.demo.request.cooldown.hours=0
