# PostgreSQL connection
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/smartmaint_staging}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=org.postgresql.Driver

# JWT - access token: 15 min | refresh token: 30 días
jwt.secret=${JWT_SECRET:Smartmaint-SaaS-SecretKey-MustBeAtLeast256BitLong-ForHS256-2026!!}
jwt.expiration=${JWT_EXPIRATION_MS:900000}
jwt.refresh.expiration=${JWT_REFRESH_EXPIRATION_MS:2592000000}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=smartmaint

# Logging
logging.level.root=INFO
logging.level.org.springframework=ERROR
logging.level.org.hibernate=ERROR
logging.level.com.smartmaint=DEBUG

# Server
server.port=${SERVER_PORT:8080}

# SQL init
spring.sql.init.mode=never

# Flyway migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.default-schema=smartmaint
spring.flyway.schemas=smartmaint
spring.flyway.locations=classpath:db/migration

# Multipart support
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Mail demo (Sendinblue/Brevo)
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=${SPRING_MAIL_HOST:smtp-relay.brevo.com}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

app.demo.mail.from=${APP_DEMO_MAIL_FROM:smartmaint.co@outlook.com}
app.demo.login.url=${APP_DEMO_LOGIN_URL:http://localhost:3000/login}
app.demo.mail.logo.url=${APP_DEMO_MAIL_LOGO_URL:https://smartmaint-frontend-last.vercel.app/login}
app.demo.request.cooldown.hours=${APP_DEMO_REQUEST_COOLDOWN_HOURS:0}

# Correo de compra y recuperación de contraseña
app.purchase.mail.from=${APP_PURCHASE_MAIL_FROM:no-reply@smartmaint.com}
